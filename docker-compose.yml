# SAG-Wiki 文件解析服务器：一键部署
#
#   1. cp .env.example .env        # 可选：填 SAG_MINERU_API_KEYS（多个 key 用逗号分隔）
#   2. docker compose up -d --build
#   3. 打开 http://<主机>:3001/ui/
#
# 说明：
# - 镜像按宿主机架构自动构建：x86_64（amd64）与 ARM64（树莓派 / Apple Silicon 等）
#   都支持；多架构发布见 Dockerfile 头部的 buildx 命令。
# - 不填 key 也能启动：MinerU 未配置时 PDF/图片走本地降级；key 也可在 Web 设置页
#   里粘贴。环境变量里的 key 只驻留内存，不写入磁盘。
# - 数据（上传、输出、parse.db、设置）存在具名卷 sag-parse-data 里；换成本地目录
#   挂载时把 volumes 改成 ./data:/data。
# - 无鉴权，仅供内网使用，不要直接暴露到公网。

services:
  parse-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: sag-parse-server:latest
    container_name: sag-parse-server
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      SAG_MINERU_API_KEYS: "${SAG_MINERU_API_KEYS:-}"
      # MinerU 相关域名直连，不走代理（见 parse-server 文档“已知限制”）：
      # 若宿主机设置了 HTTP(S)_PROXY，MinerU 请求被代理时可能超时。
      NO_PROXY: "localhost,127.0.0.1,mineru.net,mineru.oss-cn-shanghai.aliyuncs.com,cdn-mineru.openxlab.org.cn"
      no_proxy: "localhost,127.0.0.1,mineru.net,mineru.oss-cn-shanghai.aliyuncs.com,cdn-mineru.openxlab.org.cn"
    volumes:
      - sag-parse-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sag-parse-data:
